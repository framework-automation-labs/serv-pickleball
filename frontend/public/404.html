<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SERV Pickleball Club</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      //
      // GitHub Pages is a static host — when someone requests a route that
      // doesn't map to a real file (e.g. /serv-pickleball/admin/login typed
      // directly into the address bar), GH Pages serves THIS file with a
      // 404 status. We encode the intended path into a query string and
      // redirect to index.html, which decodes it back (see the matching
      // script in index.html) and hands off to React Router before the
      // app renders — so the user never sees the 404 or a flash of the
      // wrong page.
      //
      // pathSegmentsToKeep = 1 because this is a project page served from
      // /serv-pickleball/ (one path segment), not a user/org root page.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
